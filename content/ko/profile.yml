intro: "8년 동안 IoT 단말 관제에서 시작해 10만 대 규모 교통 단말 운영 플랫폼을 거쳐, 최근까지 RAG와 문서 AI 서비스를 만들었습니다. 기능 하나를 만들 때도 배포, 모니터링, 그리고 실패했을 때 어떻게 동작해야 하는지를 같이 설계합니다. 업무 밖에서는 macOS·iOS 네이티브 앱과 로컬에서 돌아가는 AI 도구를 만듭니다."
